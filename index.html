<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultados ESI</title>
  <style>
    :root{
      --bg:#ffe4ec;
      --card:#ffffff;
      --accent:#ff85a2;
      --accent2:#d63384;
      --soft:#fff0f5;
      --border:#f3c7d4;
      --text:#2f2f2f;
      --muted:#6b7280;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,#ffe4ec 0%, #fff7fa 100%);
      color:var(--text);
      padding:24px;
    }
    .wrap{max-width:1200px;margin:0 auto}
    .card{
      background:var(--card);
      border:1px solid rgba(255,133,162,.2);
      border-radius:22px;
      box-shadow:0 12px 30px rgba(214,51,132,.08);
      padding:22px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .brand h1{
      margin:0 0 6px 0;
      color:var(--accent2);
      font-size:32px;
    }
    .brand p{
      margin:0;
      color:var(--muted);
    }
    .btn, a.btn, button{
      border:none;
      background:var(--accent);
      color:white;
      padding:14px 18px;
      border-radius:14px;
      font-size:16px;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
      box-shadow:0 10px 22px rgba(255,133,162,.25);
    }
    .btn.secondary, a.btn.secondary, button.secondary{
      background:#fff;
      color:var(--accent2);
      border:1px solid var(--border);
      box-shadow:none;
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:14px;
      margin-top:18px;
    }
    .stat{
      background:#fffafc;
      border:1px solid #f8dbe4;
      border-radius:18px;
      padding:16px;
    }
    .stat span{
      display:block;
      color:var(--muted);
      font-size:13px;
      margin-bottom:6px;
    }
    .stat strong{
      display:block;
      font-size:28px;
      color:var(--accent2);
    }
    .section-card{
      margin-top:18px;
      padding:16px;
      border-radius:18px;
      background:#fffafc;
      border:1px solid #f8dbe4;
    }
    .section-title{
      margin:0 0 12px 0;
      color:var(--accent2);
      font-size:22px;
    }
    .report-text{
      font-size:14px;
      color:#374151;
      line-height:1.5;
      white-space:pre-wrap;
      margin-bottom:12px;
    }
    .chart-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:14px;
      margin-top:14px;
    }
    .chart-box{
      background:#fff;
      border:1px solid #f8dbe4;
      border-radius:18px;
      padding:14px;
    }
    .chart-box h4{
      margin:0 0 10px 0;
      color:var(--accent2);
      font-size:16px;
    }
    .footer-note{
      margin-top:16px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
    .hidden{display:none !important}
    @media (max-width: 640px){
      body{padding:14px}
      .card{padding:16px;border-radius:18px}
      .brand h1{font-size:26px}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="topbar">
        <div class="brand">
          <h1>Resultados ESI</h1>
          <p>Panel de respuestas global y por curso.</p>
        </div>
        <div>
          <button class="btn secondary" id="refresh-results" type="button">Actualizar</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><span>Respuestas guardadas</span><strong id="total-count">0</strong></div>
        <div class="stat"><span>Cursos con datos</span><strong id="course-count">0</strong></div>
      </div>

      <div id="summary-global" class="section-card"></div>
      <div id="charts-global" class="chart-grid"></div>

      <div id="by-course"></div>
    </div>

    <div class="footer-note">
      Solo se muestran resultados. No hay formulario de carga.
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
